<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson_44</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<main>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1>Введите данные студента</h1>
               <form action="#" th:action="@{/create}" th:object="${student}" method="post">
                    <div class="mb-3">
                        <label for="firstName" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="firstName" name="firstName" th:field="*{firstName}">
                    </div>
                    <div class="mb-3">
                        <label for="lastName" class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="lastName" name="lastName" th:field="*{lastName}">
                    </div>
                    <button class="btn btn-primary" type="submit">Добавить студента</button>
                    <a class="btn btn-primary" href="/index" role="button">Главная</a>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
